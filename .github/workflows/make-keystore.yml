# One-off helper. Run it once from the Actions tab, download the artifact,
# copy the two values into repository secrets, then delete the artifact.
name: Create signing keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for the keystore (make one up, then keep it safe)'
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore debritsu.jks \
            -alias debritsu \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "CN=Debritsu, OU=None, O=None, L=None, S=None, C=GB"
          base64 -w0 debritsu.jks > keystore-base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-KEEP-PRIVATE
          path: |
            debritsu.jks
            keystore-base64.txt
