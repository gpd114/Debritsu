name: Release

# Publishing is deliberately manual: push a version tag when you want a release.
#   git tag v0.7.1     && git push origin v0.7.1      (phone)
#   git tag tv-v0.1.0  && git push origin tv-v0.1.0   (television)
on:
  # Drafting a release in the web UI fires `release`, not `push`, so listen for
  # both — otherwise a UI-created release quietly gets no APK attached.
  release:
    types: [ published ]
  push:
    # Two applications, two series of tags. They are separate installs with
    # separate application ids, so their version numbers answer to nobody but
    # themselves and must not share a namespace.
    tags: [ 'v*', 'tv-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: debritsu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debritsu.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/debritsu.jks" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Refuse to publish an unsigned build
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "No signing key configured. A debug-signed release can never be" >&2
          echo "updated in place, so publishing one would strand every user." >&2
          exit 1

      # The build reads this for versionName, so the APK always reports the tag
      # it was built from rather than whatever was last written into gradle.
      - name: Build release APK
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: gradle assembleRelease --no-daemon

      - name: Name the artifact after the tag
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # tv-v0.1.0 becomes tv-0.1.0, v1.3.0 becomes 1.3.0. Once the file is
          # downloaded its name is the only thing saying which of the two
          # applications it is, and they cannot replace each other.
          case "$TAG" in
            tv-v*) VERSION="tv-${TAG#tv-v}" ;;
            *)     VERSION="${TAG#v}" ;;
          esac
          cp app/build/outputs/apk/release/app-release.apk "debritsu-${VERSION}.apk"
          echo "APK=debritsu-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          tag_name: ${{ env.TAG }}
          # Full releases. This used to read github.event.release.prerelease,
          # which is absent on a tag push and so always fell through to false —
          # the right answer by accident, and confusing to read.
          prerelease: false
          generate_release_notes: true
          body: |
            Install the APK below. Android will ask you to allow installs from
            whichever app you download it with.

            **Setup:** Settings → add a Stremio addon URL (a debrid-backed one
            such as AIOStreams, Comet or MediaFusion). AniList sign-in is
            optional. Debritsu ships no sources and no content of its own.
