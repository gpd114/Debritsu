# AniList API clients for public Debritsu builds.
# Registered at https://anilist.co/settings/developer
# The client IDs are not secrets; the implicit grant is designed for public clients.

# Phone and television. Redirect URL: debritsu://auth
# The app catches that custom scheme with an intent filter and reads the token
# out of the URL fragment.
clientId=48123

# Windows. Redirect URL: https://anilist.co/api/v2/oauth/pin
# A separate client because AniList allows one redirect URL per client, and a
# desktop program cannot catch a custom scheme the way an Android app can. The
# pin page shows the token for the user to copy instead.
desktopClientId=50254
